name: Build Android

# 在 GitHub 托管的 ubuntu-latest runner 上编译 Android APK（按 ABI 分包并签名），
# 并发布到本仓库 GitHub Release（tag: v{version}-android）。
# 触发方式：手动（workflow_dispatch）。
on:
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: "true"

jobs:
  android:
    name: Android (split per ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu runner 自带 Android SDK，不再用 android-actions/setup-android（它的 license 交互会卡住）
      - name: 准备 Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          ls "$SDK/ndk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - run: pnpm install --frozen-lockfile

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 编译 APK（按 ABI 分包）
        run: pnpm tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64

      - name: 签名 APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 ANDROID_KEY_BASE64 secret，无法签名"; exit 1
          fi
          KS="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          mkdir -p artifacts
          found=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk'); do
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            out="artifacts/HGhub_${VERSION}_${abi}.apk"
            "$APKSIGNER" sign \
              --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
              --v4-signing-enabled false \
              --out "$out" "$f"
            "$APKSIGNER" verify --print-certs "$out" | head -3
            found=$((found+1))
          done
          rm -f "$KS"
          if [ "$found" -eq 0 ]; then echo "::error::没有找到 release APK"; exit 1; fi
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh artifacts

      - name: 获取版本号
        id: ver
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}-android"
          TITLE="HGhub v${VERSION} Android"
          NOTES="$(cat <<EOF
          ## HGhub Android 编译发布版 (v${VERSION})

          本仓库为 [Minireel/HGhub](https://github.com/Minireel/HGhub) 的 fork，此 Release 提供对应源码版本（v${VERSION}）的 Android 预编译产物。

          ### 下载说明
          - 按 ABI 分包的已签名 APK（\`HGhub_${VERSION}_<abi>.apk\`）
          - 常见设备选 **aarch64**（64 位 ARM）；部分旧设备选 **armv7**；模拟器可选 **x86_64**

          使用本仓库独立生成的发布签名密钥签署。请从同一签名来源升级，换签名将无法覆盖安装。
          EOF
          )"
          # trim incidental leading spaces from the YAML-indented heredoc
          NOTES="$(printf '%s\n' "$NOTES" | sed 's/^          //')"
          shopt -s nullglob
          files=(artifacts/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::没有可发布的产物"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "${files[@]}" --title "$TITLE" --notes "$NOTES"
          fi
